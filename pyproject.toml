[project]
name = "crewai-mcp-server"
version = "1.2.0"
description = "MCP Server that turns any AI agent into a CrewAI orchestrator — documentation, tools, and workflow management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "mcp[cli]>=1.0",
    "crewai>=1.14.0,<2.0",
    "crewai-tools>=0.40.0,<2.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
crewai-mcp = "crewai_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# One shared event loop for fixtures AND tests: the MCP ClientSession lives
# on the session loop; per-test loops would deadlock its awaits.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "slow: heavy crewai runtime tests (install, kickoff, flows, RAG) — run in weekly CI",
]
